[package]
name = "fairplay-v2-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of UxPlay's FairPlay selector-2 receiver primitive"
license = "LGPL-2.1-or-later"

[lib]
name = "fairplay_v2"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "fairplay_v2_oracle"
path = "src/bin/fairplay_v2_oracle.rs"
required-features = ["oracle"]

[features]
oracle = []

[dependencies]
libc = "0.2"
openssl = "0.10"
uxplay-crypto = { path = "../crypto" }
zeroize = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
