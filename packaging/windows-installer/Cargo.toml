[package]
name = "uxplay-windows-installer"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "Setup"
path = "src/main.rs"

[build-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
winreg = "0.52"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
