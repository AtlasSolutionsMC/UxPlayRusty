name: Rust macOS acceptance

on:
  push:
    branches: [master, windows-delivery]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native media and plist dependencies
        run: brew install gstreamer libplist openssl@3 pkgconf

      - name: Configure native dependency paths
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix libplist)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app -> target
            beacon -> target

      - name: Format standalone BLE beacon
        run: cargo fmt --manifest-path beacon/Cargo.toml -- --check

      - name: Test standalone BLE beacon
        run: cargo test --manifest-path beacon/Cargo.toml --all-targets

      - name: Lint standalone BLE beacon
        run: cargo clippy --manifest-path beacon/Cargo.toml --all-targets -- -D warnings

      - name: Build standalone BLE beacon
        run: cargo build --manifest-path beacon/Cargo.toml --release

      - name: Format
        run: cargo fmt --manifest-path app/Cargo.toml -- --check

      - name: Test macOS Bonjour and P2P configuration
        # The hosted runner registers VideoToolbox, but its HLS fixture is
        # software-only and VideoToolbox cannot decode it in this headless test.
        # Apply the documented rank override before GStreamer initializes.
        env:
          GST_PLUGIN_FEATURE_RANK: "vtdechw0:NONE,avdec_h264:MAX"
        run: cargo test --manifest-path app/Cargo.toml --all-targets --features apple-p2p

      - name: Lint macOS Bonjour and P2P configuration
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets --features apple-p2p -- -D warnings

      - name: Build macOS release
        run: cargo build --manifest-path app/Cargo.toml --release --features apple-p2p

      - name: Smoke standalone CLI
        run: |
          app/target/release/uxplay -h >/dev/null
          app/target/release/uxplay -v | grep -q '^UxPlay version '
