name: Rust Linux acceptance

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install native build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libavahi-compat-libdnssd-dev \
            libplist-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/app -> target

      - name: Format
        run: cargo fmt --manifest-path rust/app/Cargo.toml -- --check

      - name: Test embedded mDNS configuration
        run: cargo test --manifest-path rust/app/Cargo.toml --all-targets

      - name: Lint embedded mDNS configuration
        run: cargo clippy --manifest-path rust/app/Cargo.toml --all-targets -- -D warnings

      - name: Build embedded mDNS release
        run: cargo build --manifest-path rust/app/Cargo.toml --release

      - name: Smoke standalone CLI
        run: |
          home="$(mktemp -d)"
          env -u UXPLAYRC HOME="$home" XDG_CONFIG_HOMEDIR="$home" rust/app/target/release/uxplay -h >/dev/null
          env -u UXPLAYRC HOME="$home" XDG_CONFIG_HOMEDIR="$home" rust/app/target/release/uxplay -v | grep -q '^UxPlay version '
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile

          executable = os.fsencode("rust/app/target/release/uxplay")
          with tempfile.TemporaryDirectory(prefix="uxplay-argv-smoke-") as home:
              env = os.environ.copy()
              env.pop("UXPLAYRC", None)
              env["HOME"] = home
              env["XDG_CONFIG_HOMEDIR"] = home
              result = subprocess.run(
                  [executable, b"\xff"],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
          assert result.returncode == 0, result.returncode
          assert result.stdout == b"", result.stdout
          assert result.stderr == (
              b'Error: detected a non-ascii or non-UTF-8 string "\xff"'
              b"while parsing input arguments"
          ), result.stderr
          PY

      - name: Smoke Rust server endpoint
        run: |
          python3 - <<'PY'
          import os
          import signal
          import socket
          import subprocess
          import sys
          import tempfile
          import time

          with tempfile.TemporaryDirectory(prefix="uxplay-smoke-") as home, tempfile.TemporaryFile() as log:
              with socket.socket() as probe:
                  probe.bind(("127.0.0.1", 0))
                  port = probe.getsockname()[1]
              env = os.environ.copy()
              env.pop("UXPLAYRC", None)
              env["HOME"] = home
              env["XDG_CONFIG_HOMEDIR"] = home
              proc = subprocess.Popen(
                  ["rust/app/target/release/uxplay", "-n", "CodexLinuxSmoke", "-a", "-hls", "-vs", "0",
                   "-p", "tcp", f"{port + 1},{port},{port + 2}"],
                  env=env, stdout=log, stderr=subprocess.STDOUT,
              )
              failure = None
              try:
                  deadline = time.monotonic() + 20
                  while time.monotonic() < deadline:
                      if proc.poll() is not None:
                          break
                      try:
                          with socket.create_connection(("127.0.0.1", port), timeout=1) as client:
                              client.settimeout(1)
                              client.sendall(
                                  b"GET /server-info HTTP/1.1\r\n"
                                  b"Host: 127.0.0.1\r\n"
                                  b"X-Apple-Session-ID: smoke\r\n"
                                  b"Connection: close\r\n\r\n"
                              )
                              response = client.makefile("rb")
                              status = response.readline().split()
                              headers = {}
                              while True:
                                  line = response.readline()
                                  if line in (b"", b"\r\n"):
                                      break
                                  name, value = line.split(b":", 1)
                                  headers[name.strip().lower()] = value.strip()
                              content_length = int(headers.get(b"content-length", b"0"))
                              body = response.read(content_length)
                              if len(status) < 2 or status[1] != b"200":
                                  raise RuntimeError(
                                      f"server returned {status!r}: {body!r}"
                                  )
                              assert b"<key>deviceid</key>" in body
                              break
                      except (OSError, TimeoutError):
                          time.sleep(0.2)
                  else:
                      raise RuntimeError("server-info endpoint did not become ready")
                  if proc.poll() is not None:
                      raise RuntimeError("server exited before serving server-info")
              except Exception as error:
                  failure = error
              finally:
                  if proc.poll() is None:
                      proc.send_signal(signal.SIGINT)
                  try:
                      return_code = proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      return_code = proc.wait()
                      failure = failure or RuntimeError("server did not stop after SIGINT")
              if failure is not None or return_code != 0:
                  log.seek(0)
                  sys.stderr.write(log.read().decode(errors="replace"))
              if failure is not None:
                  raise failure
              if return_code != 0:
                  raise RuntimeError(f"server exited with status {return_code}")
          PY

      - name: Test external DNS-SD configuration
        run: cargo test --manifest-path rust/app/Cargo.toml --all-targets --features external-dns-sd

      - name: Lint external DNS-SD configuration
        run: cargo clippy --manifest-path rust/app/Cargo.toml --all-targets --features external-dns-sd -- -D warnings

      - name: Build external DNS-SD release
        run: cargo build --manifest-path rust/app/Cargo.toml --release --features external-dns-sd
