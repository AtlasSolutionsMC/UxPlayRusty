name: Windows installer smoke

on:
  workflow_dispatch:
  push:
    branches:
      - windows-delivery
    paths:
      - '.github/workflows/windows-installer-smoke.yml'
      - 'app/**'
      - 'beacon/**'
      - 'core/**'
      - 'render/**'
      - 'units/**'
      - 'packaging/windows/**'
      - 'packaging/windows-tools/**'
      - 'packaging/windows-installer/**'
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2025
    steps:
      - name: Keep MSYS2 checkout line endings stable
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libmicrodns

      - name: Install Rust GNU toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy,rustfmt

      - name: Run Windows app and beacon quality gates
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:RUSTUP_TOOLCHAIN = 'stable-x86_64-pc-windows-gnu'
          $env:Path = (Join-Path $env:MSYS2_ROOT 'ucrt64\bin') + ';' + $env:Path
          cargo fmt --manifest-path .\app\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path .\beacon\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path .\render\video-renderer\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path .\render\video-renderer\Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path .\app\Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path .\app\Cargo.toml --all-targets --features external-dns-sd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path .\beacon\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .\app\Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .\app\Cargo.toml --all-targets --features external-dns-sd -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .\beacon\Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .\render\video-renderer\Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Rust installer
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          cargo run --release --manifest-path .\packaging\windows-tools\Cargo.toml -- package-release $env:MSYS2_ROOT

      - name: Smoke bundled runtime
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: cargo run --release --manifest-path .\packaging\windows-tools\Cargo.toml -- smoke-runtime .\dist\windows\stage $env:MSYS2_ROOT

      - name: Transfer installer to fresh Windows runner
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-smoke
          path: dist/windows/Setup.exe
          retention-days: 1

  clean-machine-install:
    needs: build-installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download provisional installer
        uses: actions/download-artifact@v4
        with:
          name: windows-setup-smoke
          path: dist/windows

      - name: Install, launch without MSYS2, and uninstall
        shell: pwsh
        run: cargo run --release --manifest-path .\packaging\windows-tools\Cargo.toml -- test-install .\dist\windows\Setup.exe
