[package]
name = "compat-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of the Windows socket error formatter in lib/compat.c"

[lib]
crate-type = ["rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
