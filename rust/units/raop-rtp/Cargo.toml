[package]
name = "uxplay-raop-rtp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
compat-rs = { path = "../compat" }
uxplay-crypto = { path = "../crypto" }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
