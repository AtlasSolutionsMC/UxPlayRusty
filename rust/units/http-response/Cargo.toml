[package]
name = "http-response-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of UxPlay's HTTP response byte builder"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
